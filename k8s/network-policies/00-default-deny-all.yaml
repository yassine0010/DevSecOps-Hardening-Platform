apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    security: zero-trust
spec:
  # Matches ALL pods in the namespace
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress or egress rules = deny everything by default.
  # All allowed traffic must be explicitly granted by other policies.
