apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kubelet-health-probes
  labels:
    security: observability
spec:
  # Allow kubelet to reach all pods for liveness/readiness probes.
  # Kubernetes health probes originate from the node (host network), not from
  # a pod, so they are controlled via ipBlock rather than podSelector.
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        # 10.0.0.0/8 covers most private node CIDR ranges used by cloud providers.
        # Adjust this block to match your actual node IP range.
      - ipBlock:
          cidr: 192.168.0.190/32
      - ipBlock:
          cidr: 192.168.0.185/32
      - ipBlock:
          cidr: 192.168.0.154/32
