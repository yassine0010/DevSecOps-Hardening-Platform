apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-leaderboard
  labels:
    security: ingress-control
    component: leaderboard-service
spec:
  # Target: leaderboard-service pod
  podSelector:
    matchLabels:
      app: leaderboard-service
  policyTypes:
    - Ingress
  ingress:
    # Only the NGINX Gateway Fabric data-plane pods may reach leaderboard-service.
    # The gateway pods run in the same (default) namespace, so only a
    # podSelector is needed — no namespaceSelector required.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: myapp-gateway-nginx #this is the label created by them
      ports:
        - protocol: TCP
          port: 3003
