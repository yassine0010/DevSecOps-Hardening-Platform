apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: postgres-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        fsGroup: 1234
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: postgres
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1234:1234 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      containers:
        - name: postgres
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            # NOTE: readOnlyRootFilesystem is intentionally NOT set for postgres.
            # postgres writes its Unix socket to /var/run/postgresql at startup,
            # which lives in the root filesystem. Setting readOnlyRootFilesystem: true
            # would cause immediate crash. The data volume already isolates the data.
            capabilities:
              drop:
                - ALL
          image: postgres:15
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # /tmp for any transactional temp files postgres may write
            - name: tmp-dir
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mindgrid_user
                - -d
                - mindgrid
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - mindgrid_user
                - -d
                - mindgrid
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: tmp-dir
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: postgres-retain
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi