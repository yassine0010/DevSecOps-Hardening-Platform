# deployer-rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-rolebinding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: dev
roleRef:
  kind: Role
  name: deployer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-rolebinding
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: prod
roleRef:
  kind: Role
  name: deployer-role
  apiGroup: rbac.authorization.k8s.io